<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mảnh Ghép Hồn Việt</title>
    
    <!-- Thêm thẻ canonical mặc định ở đây để fix triệt để lỗi MISSING -->
    <link rel="canonical" href="https://manhghephonviet.com/" />

    <!-- Preload ảnh banner chính để tối ưu điểm LCP -->
    <link rel="preload" as="image" href="/images/Bìa trang chủ.webp" fetchpriority="high" />

    <meta name="description" content="Nền tảng trải nghiệm và kết nối di sản lịch sử văn hóa Việt Nam." />
    <meta property="og:title" content="Mảnh Ghép Hồn Việt" />
    <meta property="og:description" content="Nền tảng trải nghiệm và kết nối di sản lịch sử văn hóa Việt Nam." />

    <!-- Biểu tượng website (Favicon) -->
    <link rel="icon" type="image/png" href="/Favicon.png" />

    <!-- Google Fonts Preconnect (Kết nối sớm với máy chủ Google) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload để nạp sớm dữ liệu phông chữ và icon -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap&subset=vietnamese" 
    />

    <!-- Tải CSS phông chữ và icon bất đồng bộ (Non-blocking) bằng media="print" -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap&subset=vietnamese" 
      media="print" 
      onload="this.media='all'" 
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap&subset=vietnamese" 
      />
    </noscript>

    <!-- Style tùy chỉnh trực tiếp -->
    <style>
      .font-playfair {
        font-family: 'Playfair Display', Georgia, Cambria, 'Times New Roman', Times, serif !important;
      }
    </style>

    <!-- Google tag (gtag.js) - Trì hoãn tải cho đến khi có tương tác đầu tiên của người dùng -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QKNR3RML6X');

      var gtmLoaded = false;
      function loadGTM() {
        if (gtmLoaded) return;
        gtmLoaded = true;
        
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-QKNR3RML6X';
        document.head.appendChild(script);

        // Xóa các sự kiện lắng nghe sau khi đã tải xong
        ['scroll', 'mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
          window.removeEventListener(evt, loadGTM, { passive: true });
        });
      }

      // Lắng nghe tương tác đầu tiên từ người dùng để nạp ngầm GTM
      ['scroll', 'mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, loadGTM, { passive: true, once: true });
      });

      // Phòng hờ nếu người dùng không tương tác, tự động tải sau 4 giây
      setTimeout(loadGTM, 4000);
    </script>
  </head>
  <body class="antialiased bg-[#FDFBF7] text-[#261816] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
